name: Model test request
description: Share original files to verify another Canon model, firmware or format
title: "[Model test] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Please read `SUPPORT.md` first.

        Use non-personal test frames. Camera files may contain serial numbers,
        GPS and other EXIF metadata.

  - type: input
    id: model
    attributes:
      label: Camera model
      placeholder: Canon EOS R3
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware version
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: File format
      multiple: true
      options:
        - CR3
        - JPEG
        - Other
    validations:
      required: true

  - type: input
    id: files
    attributes:
      label: Sample files
      description: Link to 3-5 original files, or attach small in-camera JPEG files. Do not edit or convert them.
      placeholder: https://...
    validations:
      required: true

  - type: dropdown
    id: shutter
    attributes:
      label: Shutter modes used
      multiple: true
      options:
        - Mechanical
        - Electronic First Curtain
        - Electronic
        - Mixed / not sure
    validations:
      required: true

  - type: textarea
    id: order
    attributes:
      label: Frame order and original filenames
      description: List files in shooting order, shutter mode, and any intermediate frames that were deleted or not shared.
      placeholder: |
        IMG_0001.CR3 - mechanical
        IMG_0002.CR3 - electronic
        IMG_0003.CR3 - mechanical
    validations:
      required: true

  - type: textarea
    id: history
    attributes:
      label: Numbering and card history
      description: Mention known card formatting, folder changes or file-number resets. Do not perform a reset solely for this test.

  - type: input
    id: known_count
    attributes:
      label: Trusted counter value (optional)
      description: If available, state the value and whether it was read before or after the sample sequence.

  - type: checkboxes
    id: consent
    attributes:
      label: Confirmation
      options:
        - label: These are original, unmodified files from the camera.
          required: true
        - label: I understand that public attachments expose their EXIF metadata.
          required: true
        - label: I allow these files to be analyzed to verify the counter format.
          required: true
