name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ExifTool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Check browser scripts
        run: node --check docs/app.js && node --check docs/canon-parser.js
      - name: Run browser reader tests
        run: npm run test:web
      - name: Check CLI
        run: python canon_r_shutter_count.py --version
